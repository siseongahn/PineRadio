# PineRadio stream relay — include inside the `server { ... }` block that serves https://digipine.com
# (the same block that has the /radio/ location). Forwards /radio/stream?u=<http url> to
# tools/stream_proxy.py, which fetches plain-http radio streams so they play on the https page.

location = /radio/stream {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";

    # live audio: never buffer or cache, keep long-lived connections open
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    gzip off;
}
