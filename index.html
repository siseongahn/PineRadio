<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PinePlayer Radio</title>
<link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- only the glyphs of "PinePlayer Radio" are downloaded (text= subset) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fugaz+One&text=PinePlayer%20Radio&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root {
  --bg: #f6f7f5; --panel: #ffffff; --line: #e3e6e1; --text: #1d211c; --muted: #6b7268;
  --accent: #2f7d4f; --accent-soft: #e2f1e7; --danger: #b3412f; --chip: #eef0ec;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141714; --panel: #1c201c; --line: #2c322c; --text: #e6eae4; --muted: #949c91;
    --accent: #5fc286; --accent-soft: #1f3327; --danger: #e07a68; --chip: #262b26; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141714; --panel: #1c201c; --line: #2c322c; --text: #e6eae4; --muted: #949c91;
  --accent: #5fc286; --accent-soft: #1f3327; --danger: #e07a68; --chip: #262b26; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* header */
header {
  display: flex; gap: 12px; align-items: center; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.brand-name { font-family: "Fugaz One", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; font-size: 18px; line-height: 1.1; letter-spacing: .01em; }
.brand img { width: 24px; height: 24px; border-radius: 6px; display: block; }
.tabs { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 5px 14px; border-radius: 6px; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.search { flex: 1; min-width: 220px; display: flex; gap: 8px; align-items: center; }
.search input {
  flex: 1; min-width: 0; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

.ui-lang { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.ui-lang select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }

/* layout */
main { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside .filter { padding: 10px; border-bottom: 1px solid var(--line); }
aside .filter input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
#side { overflow-y: auto; flex: 1; padding: 4px 0; }
.side-item {
  display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none;
  padding: 6px 14px; text-align: left;
}
.side-item:hover { background: var(--chip); }
.side-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-all { font-weight: 600; border-bottom: 1px solid var(--line); }
.chip-more { background: none; border-color: var(--line); color: var(--muted); }
.side-item .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.side-head {
  padding: 10px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
}
.side-head:not(:first-child) { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 12px; }

#content { overflow-y: auto; min-height: 0; padding: 14px 18px 30px; }
.crumb { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.crumb h2 { margin: 0; font-size: 20px; }
.crumb .meta { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chips .label { color: var(--muted); font-size: 12px; min-width: 44px; padding: 4px 4px 0 0; flex-shrink: 0; }
.chip {
  border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 13px;
}
.chip .n { color: var(--muted); font-size: 11px; margin-left: 4px; }
.chip.on { background: var(--accent); color: #fff; }
.chip.on .n { color: rgba(255,255,255,.8); }
.status { color: var(--muted); margin: 10px 0; min-height: 20px; }

.list { display: flex; flex-direction: column; gap: 2px; }
.row {
  display: grid; grid-template-columns: 36px 40px 1fr auto; gap: 10px; align-items: center;
  padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid transparent;
}
.row:hover { border-color: var(--line); }
.row.playing { border-color: var(--accent); background: var(--accent-soft); }
.play {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--chip);
  display: grid; place-items: center; color: var(--text);
}
.play:hover, .row.playing .play { background: var(--accent); color: #fff; }
.logo {
  width: 40px; height: 40px; border-radius: 6px; background: var(--chip); object-fit: cover;
  display: grid; place-items: center; color: var(--muted); font-weight: 700; overflow: hidden;
}
.info { min-width: 0; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub .tag { display: inline-block; margin-right: 6px; }
.sub .guess { opacity: .7; font-style: italic; }
.actions { display: flex; gap: 4px; }
.icon-btn { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 6px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--chip); color: var(--text); }
.icon-btn.fav-on { color: #d9a400; }
.more { margin: 12px auto; display: block; padding: 8px 20px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; }

.tracks { margin: 2px 0 8px 46px; display: flex; flex-direction: column; gap: 1px; }
.track {
  display: flex; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 4px 8px;
  border-radius: 6px; width: 100%; font-size: 13px;
}
.track:hover { background: var(--chip); }
.track.playing { color: var(--accent); font-weight: 600; }
.track .i { color: var(--muted); width: 32px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.track .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* player */
footer {
  background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
}
.ctrls { display: flex; gap: 6px; align-items: center; }
.big { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.big:disabled { opacity: .4; cursor: default; }
.now { min-width: 0; }
.now .name { font-size: 14px; }
.now .sub.err { color: var(--danger); }
.now-wrap { display: flex; gap: 10px; align-items: center; min-width: 0; }
.now-art { flex-shrink: 0; }

/* station details dialog */
dialog#details {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text);
  padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 10px 40px rgba(0,0,0,.35);
}
dialog#details::backdrop { background: rgba(0,0,0,.45); }
.d-head { display: flex; gap: 14px; align-items: center; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.d-head .logo { width: 72px; height: 72px; font-size: 28px; border-radius: 10px; flex-shrink: 0; }
.d-head .d-title { flex: 1; min-width: 0; }
.d-head h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
.d-head .d-acts { display: flex; gap: 6px; margin-top: 8px; }
.d-head .d-acts button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 12px; display: flex; gap: 6px; align-items: center; }
.d-head .d-acts button.on { color: #d9a400; }
.d-close { align-self: flex-start; }
.d-body { padding: 4px 16px 16px; overflow-y: auto; }
.d-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.d-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.d-grid dt { color: var(--muted); }
.d-grid dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.d-grid a { color: var(--accent); }
.d-url { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.d-ok { color: var(--accent); } .d-fail { color: var(--danger); }
.d-note { color: var(--muted); font-size: 13px; }
.seek { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; accent-color: var(--accent); }
.vol { display: flex; gap: 6px; align-items: center; }
.vol input { width: 90px; accent-color: var(--accent); }
.hidden { display: none !important; }
/* sidebar (country / collection list) closed with the header button */
#sideToggle { color: var(--text); }
#sideToggle[aria-expanded="false"] { color: var(--muted); }
body.side-closed main { grid-template-columns: 1fr; }
body.side-closed aside { display: none; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

@media (max-width: 760px) {
  body { overflow: auto; }
  header { padding: 10px 16px; }
  main { grid-template-columns: 1fr; }
  aside { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  #content { padding: 12px 16px 24px; }
  .row { grid-template-columns: 34px 1fr auto; }
  .row .logo { display: none; }
  footer { grid-template-columns: auto 1fr; }
  .vol { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/logo-48.png" srcset="icons/logo-48.png 2x, icons/logo-72.png 3x" width="24" height="24" alt="">
    <div class="brand-name">PinePlayer Radio</div>
  </div>
  <button class="icon-btn" id="sideToggle" aria-controls="sidePanel" aria-expanded="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <div class="tabs" role="tablist">
    <button data-tab="radio" class="on" data-i18n="tab_radio"></button>
    <button data-tab="audiobooks" data-i18n="tab_audiobooks"></button>
    <button data-tab="favorites" data-i18n="tab_favorites"></button>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off">
    <select id="scope">
      <option value="current" data-i18n="scope_current"></option>
      <option value="all" data-i18n="scope_all"></option>
    </select>
  </div>
  <label class="ui-lang">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    <select id="uiLang"></select>
  </label>
</header>

<main>
  <aside id="sidePanel">
    <div class="filter"><input id="sideFilter" type="search"></div>
    <div id="side"></div>
  </aside>
  <section id="content"></section>
</main>

<footer>
  <div class="ctrls">
    <button class="icon-btn" id="prev"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
    <button class="big" id="toggle" disabled></button>
    <button class="icon-btn" id="next"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>
  <div class="now-wrap">
  <div class="now-art hidden" id="nowArt"></div>
  <div class="now">
    <div class="name" id="nowName"></div>
    <div class="sub" id="nowSub"></div>
    <div class="seek hidden" id="seekBox"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="tDur">0:00</span></div>
  </div>
  </div>
  <div class="vol">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>
</footer>

<audio id="audio" preload="none"></audio>
<dialog id="details"></dialog>

const storeGet = (k, d) => { try { const v = localStorage.getItem("pineradio:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
// First visit: pick the UI language from the browser's language list and save it.
// Later visits: always use the saved choice (changed only via the language menu).
function detectLocale() {
  for (const tag of navigator.languages?.length ? navigator.languages : [navigator.language || ""]) {
    const t = tag.toLowerCase();
    if (t.startsWith("zh")) return /hant|-tw|-hk|-mo/.test(t) ? "zh-Hant" : "zh-Hans";
    const base = t.split("-")[0];
    if (LOCALES.includes(base)) return base;
  }
  return "en";
}
let LOCALE = storeGet("locale", null);
if (!LOCALES.includes(LOCALE)) {
  LOCALE = detectLocale();
  try { localStorage.setItem("pineradio:locale", JSON.stringify(LOCALE)); } catch {}
}
let LI = LOCALES.indexOf(LOCALE);
let regionNames, languageNames;
function setLocale(loc) {
  LOCALE = loc; LI = LOCALES.indexOf(loc);
  document.documentElement.lang = loc;
  try { regionNames = new Intl.DisplayNames([loc, "en"], { type: "region" }); } catch { regionNames = null; }
  try { languageNames = new Intl.DisplayNames([loc, "en"], { type: "language" }); } catch { languageNames = null; }
}

  try { return (code && regionNames?.of(code)) || name; } catch { return name; }
}

  try {

const radioRowsCache = new Map();
async function radioRows(country) {
  if (radioRowsCache.has(country)) return radioRowsCache.get(country);
  const info = S.index.radio.countries[country];
  const doc = await loadJSON("data/" + info.file);
  const rows = [];
  for (const [lang, L] of Object.entries(doc.languages))
    for (const [genre, G] of Object.entries(L.genres))
      for (const s of G.stations)
        rows.push({ kind: "radio", ...s, country, lang, genre, _k: norm(s.name) + " " + norm(s.url) });
  // hand-picked stations (tools/featured/*.m3u) come first, in their list order
  rows.sort((a, b) => (a.featured || Infinity) - (b.featured || Infinity));
  radioRowsCache.set(country, rows);
  return rows;
}
const bookRowsCache = new Map();
async function bookRows(slug) {
  if (bookRowsCache.has(slug)) return bookRowsCache.get(slug);

  const rows = doc.items.map((p, i) => ({ kind: "book", id: slug + "#" + i, collection: slug, collectionName: doc.collection,
    title: p.title, folder: p.folder, tracks: p.tracks, _k: norm(p.title) + " " + norm(p.folder) }));

}

const LOCALE_COUNTRIES = {
  "en": { codes: "US GB CA AU IE NZ ZA JM NG GH KE UG ZM ZW TZ RW SS BW NA LS SZ MW SL LR GM CM MT SG PH IN PK "
               + "TT BS BB BZ GY AG DM GD KN LC VC BM KY VG VI AI MS GI IM JE GG FK GU AS MP FJ PG SB VU WS TO KI TV NR PW MH FM CK NU" },
  "zh-Hans": { codes: "CN SG TW HK MO", ordered: true },
  "zh-Hant": { codes: "TW HK MO CN SG", ordered: true },
  "fr": { codes: "FR BE CH CA LU MC HT SN CI CM CD CG ML BF NE TG BJ GN GA CF TD MG DJ KM BI RW SC MU "
               + "RE GP MQ GF YT PF NC PM BL MF WF VU" },
  "de": { codes: "DE AT CH LI LU BE" },

function countryGroups() {
  const entries = Object.entries(S.index.radio.countries).sort((a, b) => b[1].count - a[1].count);
  const conf = LOCALE_COUNTRIES[LOCALE];
  if (!conf) return { local: [], other: entries };
  const codes = conf.codes.split(/\s+/);
  const isLocal = ([, info]) => info.code && codes.includes(info.code);
  const local = entries.filter(isLocal);
  if (conf.ordered) local.sort((a, b) => codes.indexOf(a[1].code) - codes.indexOf(b[1].code));

function renderSide() {
  const side = $("#side"); side.textContent = "";
  const f = norm($("#sideFilter").value);
  const frag = document.createDocumentFragment();
  if (S.tab === "radio") {
    const { local, other } = countryGroups();
    const allLabel = t("all_countries");
    if (!f || norm(allLabel).includes(f) || "all countries".includes(f)) {

      frag.append(b);
    }
    const addGroup = (title, list) => {
      const items = list.filter(([name]) => !f || norm(countryName(name)).includes(f) || norm(name).includes(f));
      if (!items.length) return;
      if (title) frag.append(el("div", "side-head", title));
      for (const [name, info] of items) {
        const b = el("button", "side-item" + (name === S.country ? " on" : ""));

        frag.append(b);
      }
    };
    addGroup(local.length ? t("sec_local") : null, local);
    addGroup(local.length ? t("sec_other") : null, other);
  } else if (S.tab === "audiobooks") {
    const list = Object.entries(S.index.audiobooks).sort((a, b) => a[0].localeCompare(b[0]));
    for (const [slug, info] of list) {
      const label = slug.replace(/_/g, " ");
      if (f && !label.includes(f)) continue;
      const b = el("button", "side-item" + (slug === S.collection ? " on" : ""));
      b.append(el("span", null, label), el("span", "n", num(info.playlists)));

// ---------- main content ----------
function resetAndRender() { S.shown = PAGE; S.openPlaylist = null; renderSide(); renderContent(); }

async function renderContent() {
  const run = ++S.runId;
  const c = $("#content"); c.textContent = "";
  const q = terms();
  const global = S.scope === "all" && q.length && S.tab !== "favorites";

  if (S.tab === "favorites") {
    S.rows = S.favs.filter(r => matches({ _k: norm(r.name || r.title) + " " + norm(r.url || r.collection) }, q));
    c.append(crumb(t("tab_favorites")));
    return renderRows(c);
  }

  if (global) return renderGlobal(c, q, run);

  if (S.tab === "radio") {
    const countries = S.index.radio.countries;
    if (!S.country || (S.country !== ALL && !countries[S.country])) {
      const { local, other } = countryGroups();
      S.country = (local[0] || other[0])[0];
    }
    const isAll = S.country === ALL;
    const info = isAll ? allCountriesInfo() : countries[S.country];
    c.append(crumb(isAll ? t("all_countries") : countryName(S.country)));
    const langs = Object.entries(info.languages).sort((a, b) => b[1].count - a[1].count);
    c.append(chipsRow(t("label_language"), langs.map(([l, v]) => [l, langName(l, true), v.count]), S.lang,
      v => { S.lang = v; S.genre = null; S.shown = PAGE; renderContent(); }, 20));
    const gcount = {};
    for (const [l, v] of Object.entries(info.languages)) if (!S.lang || S.lang === l)
      for (const [g, n] of Object.entries(v.genres)) gcount[g] = (gcount[g] || 0) + n;
    const gs = Object.entries(gcount).sort((a, b) => (a[0] === "unclassified") - (b[0] === "unclassified") || b[1] - a[1]);
    c.append(chipsRow(t("label_genre"), gs.map(([g, n]) => [g, genreName(g), n]), S.genre,
      v => { S.genre = v; S.shown = PAGE; renderContent(); }));
    const keep = r => (!S.lang || r.lang === S.lang) && (!S.genre || r.genre === S.genre) && matches(r, q);
    if (isAll) return renderAllCountries(c, keep, run);
    const status = c.appendChild(el("div", "status", t("loading")));
    let rows;
    try { rows = await radioRows(S.country); } catch (e) { status.textContent = t("load_failed", { e: e.message }); return; }
    if (run !== S.runId) return;
    S.rows = rows.filter(keep);
    status.textContent = statusText(S.rows.length);
    return renderRows(c);
  }

  // audiobooks
  if (!S.collection || !S.index.audiobooks[S.collection]) S.collection = Object.keys(S.index.audiobooks).sort()[0];
  const info = S.index.audiobooks[S.collection];
  c.append(crumb(S.collection.replace(/_/g, " ")));
  const status = c.appendChild(el("div", "status", t("loading")));
  let rows;
  try { rows = await bookRows(S.collection); } catch (e) { status.textContent = t("load_failed", { e: e.message }); return; }
  if (run !== S.runId) return;
  S.rows = rows.filter(r => matches(r, q));
  status.textContent = statusText(S.rows.length);
  renderRows(c);
}

// "All countries": counts come from index.json at once; stations load country by country
// (largest first, 4 at a time) and matching rows show up as they arrive.
const ALL = "*";
let allInfoCache = null;
function allCountriesInfo() {
  if (allInfoCache) return allInfoCache;
  const languages = {};
  for (const c of Object.values(S.index.radio.countries))
    for (const [l, v] of Object.entries(c.languages)) {
      const L = languages[l] || (languages[l] = { count: 0, genres: {} });
      L.count += v.count;
      for (const [g, n] of Object.entries(v.genres)) L.genres[g] = (L.genres[g] || 0) + n;
    }
  return (allInfoCache = { count: S.index.radio.total, languages });
}
async function renderAllCountries(c, keep, run) {
  const status = c.appendChild(el("div", "status"));
  const listBox = c.appendChild(el("div"));
  const keys = Object.entries(S.index.radio.countries).sort((a, b) => b[1].count - a[1].count).map(e => e[0]);
  S.rows = []; let done = 0, i = 0, lastPaint = 0;
  const paint = final => {
    status.textContent = statusText(S.rows.length) + (final ? "" : " · " + t("loading_n", { d: done, t: keys.length }));
    // repaint the list only while it is still short, so scrolling isn't disturbed later
    if (final || (S.rows.length <= S.shown + PAGE && performance.now() - lastPaint > 400)) {
      lastPaint = performance.now(); listBox.textContent = ""; renderRows(listBox);
    }
  };
  const worker = async () => {
    while (i < keys.length && run === S.runId) {
      const k = keys[i++];
      try {
        const rows = await radioRows(k);
        if (run !== S.runId) return;
        for (const r of rows) if (keep(r)) S.rows.push(r);
      } catch (e) { console.warn(e); }
      done++; paint(false);
    }
  };
  paint(false);
  await Promise.all(Array.from({ length: 4 }, worker));
  if (run === S.runId) paint(true);
}

async function renderGlobal(c, q, run) {
  const isRadio = S.tab === "radio";
  c.append(crumb(t("global_search"), `“${S.query}”`));
  const status = c.appendChild(el("div", "status"));
  const listBox = c.appendChild(el("div"));
  const keys = isRadio
    ? Object.entries(S.index.radio.countries).sort((a, b) => a[1].count - b[1].count).map(e => e[0])
    : Object.entries(S.index.audiobooks).sort((a, b) => a[1].tracks - b[1].tracks).map(e => e[0]);
  S.rows = []; let done = 0, i = 0, lastPaint = 0;
  const paint = final => {
    status.textContent = t("n_found", { n: num(S.rows.length) }) + (final ? "" : " · " + t("searching", { d: done, t: keys.length }));
    if (final || performance.now() - lastPaint > 400) { lastPaint = performance.now(); listBox.textContent = ""; renderRows(listBox); }
  };
  const worker = async () => {
    while (i < keys.length && run === S.runId) {
      const k = keys[i++];
      try {
        const rows = isRadio ? await radioRows(k) : await bookRows(k);
        if (run !== S.runId) return;
        for (const r of rows) if (matches(r, q)) S.rows.push(r);
      } catch (e) { console.warn(e); }
      done++; paint(false);
    }
  };
  paint(false);
  await Promise.all(Array.from({ length: 4 }, worker));
  if (run === S.runId) paint(true);
}

function crumb(title, meta) {
  const d = el("div", "crumb"); d.append(el("h2", null, title));
  if (meta) d.append(el("span", "meta", meta));
  return d;
}
const expandedChips = new Set();
function chipsRow(label, items, current, onPick, limit) {
  const d = el("div", "chips"); d.append(el("span", "label", label));
  const mk = (val, text, n) => {
    const b = el("button", "chip" + (current === val ? " on" : ""), text);
    if (n != null) b.append(el("span", "n", num(n)));
    b.onclick = () => onPick(current === val ? null : val);
    d.append(b);
  };
  mk(null, t("all"));
  const collapsible = limit && items.length > limit + 4;
  const open = !collapsible || expandedChips.has(label);
  // keep the selected value visible even when collapsed
  const shown = open ? items : items.filter((it, idx) => idx < limit || it[0] === current);
  for (const [v, txt, n] of shown) mk(v, txt, n);
  if (collapsible) {
    const tog = el("button", "chip chip-more", open ? t("chips_less") : t("chips_more", { n: num(items.length - shown.length) }));
    tog.onclick = () => { open ? expandedChips.delete(label) : expandedChips.add(label); renderContent(); };
    d.append(tog);
  }
  return d;
}

function renderRows(c) {
  if (!S.rows.length) { c.append(el("div", "empty", t("no_results"))); return; }
  const list = el("div", "list");
  const frag = document.createDocumentFragment();
  for (const r of S.rows.slice(0, S.shown)) frag.append(r.kind === "book" ? bookRow(r) : stationRow(r));
  list.append(frag); c.append(list);
  if (S.rows.length > S.shown) {
    const more = el("button", "more", t("show_more", { n: num(S.rows.length - S.shown) }));
    more.onclick = () => { S.shown += PAGE * 2; more.remove(); list.remove(); renderRows(c); };
    c.append(more);
  }
}

function stationRow(r) {
  const row = el("div", "row" + (P.current?.url === r.url ? " playing" : ""));
  row.dataset.url = r.url;
  const btn = el("button", "play"); btn.innerHTML = P.current?.url === r.url && !audio.paused ? ICON_PAUSE : ICON_PLAY;
  btn.title = t("play");
  btn.onclick = () => P.current?.url === r.url ? P.toggle() : P.playStation(r, S.rows);
  const logo = stationArt(r.logo, r.name);
  const info = el("div", "info");
  info.append(el("div", "name", r.name));
  const sub = el("div", "sub");
  const tag = (txt, guess, title) => { const s = el("span", "tag" + (guess ? " guess" : ""), txt); if (title) s.title = title; sub.append(s); };
  if (r.country) tag(countryName(r.country), r.country_inferred, r.country_inferred ? t("guess_country") : "");
  if (r.lang) tag(langName(r.lang), r.language_inferred, r.language_inferred ? t("guess_lang") : "");
  if (r.genre) tag(genreName(r.genre));
  if (r.bitrate) tag(r.bitrate + " kbps");
  sub.title = r.url;
  info.append(sub);
  const acts = el("div", "actions");
  const fav = el("button", "icon-btn fav" + (isFav(r.url) ? " fav-on" : "")); fav.innerHTML = ICON_STAR; fav.title = t("favorite");
  fav.onclick = () => { toggleFav(r); fav.classList.toggle("fav-on", isFav(r.url)); };
  const copy = el("button", "icon-btn"); copy.innerHTML = ICON_COPY; copy.title = t("copy_url");
  copy.onclick = () => navigator.clipboard?.writeText(r.url).then(() => { copy.style.color = "var(--accent)"; setTimeout(() => copy.style.color = "", 800); });
  const more = el("button", "icon-btn"); more.innerHTML = ICON_INFO; more.title = t("info");
  more.onclick = () => openDetails(r);
  acts.append(more, fav, copy);
  row.append(btn, logo, info, acts);
  return row;
}
function initial(name) { return el("div", "logo", (name || "?").trim().charAt(0).toUpperCase()); }
// Station logo (from the data, filled from Radio Browser by tools/radiobrowser.py), or the first letter
// of the name when there is none or it fails to load. http logos would be blocked on the https site.
const usableLogo = u => /^https:\/\//i.test(u || "") || (/^http:\/\//i.test(u || "") && location.protocol !== "https:") ? u : null;
function stationArt(url, name) {
  if (!usableLogo(url)) return initial(name);
  const img = el("img", "logo"); img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.alt = "";
  img.src = url; img.onerror = () => img.replaceWith(initial(name));
  return img;
}

// ---------- station details ----------
// Data we have, plus live details from Radio Browser (radio-browser.info, public API with CORS):
// by the "rb" station id when the data has one, otherwise by exact stream address.
const RB_API = "https://all.api.radio-browser.info/json/stations/";
const rbCache = new Map();
function rbLookup(r) {
  const key = r.rb || r.url;
  if (!rbCache.has(key)) {
    const q = r.rb ? "byuuid/" + encodeURIComponent(r.rb) : "byurl?url=" + encodeURIComponent(r.url);
    rbCache.set(key, fetch(RB_API + q).then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(list => list[0] || null)
      .catch(e => { rbCache.delete(key); throw e; }));
  }
  return rbCache.get(key);
}
const safeHttpUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
function dGrid(pairs) {
  const dl = el("dl", "d-grid");
  for (const [k, v] of pairs) {
    if (v == null || v === "") continue;
    dl.append(el("dt", null, k));
    const dd = el("dd"); typeof v === "string" ? (dd.textContent = v) : dd.append(v); dl.append(dd);
  }
  return dl;
}
function openDetails(r) {
  const dlg = $("#details"); dlg.textContent = "";
  const head = el("div", "d-head");
  const art = stationArt(r.logo, r.name);
  const title = el("div", "d-title");
  title.append(el("h2", null, r.name));
  const acts = el("div", "d-acts");
  const play = el("button"); play.innerHTML = ICON_PLAY; play.append(t("play"));
  play.onclick = () => { if (P.current?.url !== r.url) P.playStation(r, S.rows.includes(r) ? S.rows : [r]); dlg.close(); };
  const fav = el("button", isFav(r.url) ? "on" : ""); fav.innerHTML = ICON_STAR; fav.append(t("favorite"));
  fav.onclick = () => { toggleFav(r); fav.classList.toggle("on", isFav(r.url)); syncRowFav(r); };
  acts.append(play, fav); title.append(acts);
  const close = el("button", "icon-btn d-close"); close.innerHTML = ICON_CLOSE; close.title = t("close");
  close.onclick = () => dlg.close();
  head.append(art, title, close);

  const body = el("div", "d-body");
  const url = el("a", "d-url", r.url); url.href = safeHttpUrl(r.url) || "#"; url.target = "_blank"; url.rel = "noopener noreferrer";
  body.append(dGrid([
    [t("d_country"), r.country && r.country !== "Unknown" ? countryName(r.country) : null],
    [t("label_language"), r.lang && r.lang !== "Unknown" ? langName(r.lang) : null],
    [t("label_genre"), r.genre ? genreName(r.genre) : null],
    [t("d_tags"), r.tags?.length ? r.tags.map(genreName).join(", ") : null],
    [t("d_bitrate"), r.bitrate ? r.bitrate + " kbps" : null],
    [t("d_stream"), url],
  ]));
  body.append(el("h3", null, "Radio Browser"));
  const rbBox = body.appendChild(el("div", "d-note", t("d_rb_loading")));
  dlg.append(head, body);
  dlg.showModal();

  rbLookup(r).then(s => {
    if (!dlg.open || !body.isConnected) return;
    if (!s) { rbBox.textContent = t("d_rb_none"); return; }
    if (!usableLogo(r.logo) && usableLogo(s.favicon)) art.replaceWith(stationArt(s.favicon, r.name));
    const link = (href, text) => { const h = safeHttpUrl(href); if (!h) return null; const a = el("a", null, text || h); a.href = h; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; };
    const check = s.lastchecktime_iso8601 ? el("span", s.lastcheckok ? "d-ok" : "d-fail",
      `${t(s.lastcheckok ? "d_ok" : "d_fail")} · ${new Date(s.lastchecktime_iso8601).toLocaleString(LOCALE)}`) : null;
    const grid = dGrid([
      [t("d_homepage"), link(s.homepage)],
      [t("d_region"), [s.state, s.country].filter(Boolean).join(", ") || null],
      [t("label_language"), s.language || null],
      [t("d_codec"), [s.codec, s.hls ? "HLS" : null].filter(x => x && x !== "UNKNOWN").join(" · ") || null],
      [t("d_bitrate"), s.bitrate ? s.bitrate + " kbps" : null],
      [t("d_tags"), s.tags ? ((tags) => tags.slice(0, 12).join(", ") + (tags.length > 12 ? ", …" : ""))(s.tags.split(",").filter(Boolean)) : null],
      [t("d_votes"), s.votes != null ? num(s.votes) : null],
      [t("d_clicks"), s.clickcount != null ? num(s.clickcount) : null],
      [t("d_check"), check],
      ["", link("https://www.radio-browser.info/history/" + encodeURIComponent(s.stationuuid), t("d_rb_open"))],
    ]);
    rbBox.replaceWith(grid);
  }).catch(() => { if (body.isConnected) rbBox.textContent = t("d_rb_error"); });
}
// keep the star in the list in step with a change made in the dialog
function syncRowFav(r) {
  document.querySelectorAll(".row[data-url]").forEach(row => {
    if (row.dataset.url === r.url) row.querySelector(".fav")?.classList.toggle("fav-on", isFav(r.url));
  });
}
$("#details").addEventListener("click", e => { if (e.target.id === "details") e.target.close(); });   // click on the backdrop

function bookRow(r) {
  const wrap = el("div");
  const row = el("div", "row" + (P.current?.playlistId === r.id ? " playing" : ""));
  const btn = el("button", "play"); btn.innerHTML = ICON_PLAY; btn.title = t("play_from_start");
  btn.onclick = () => P.playBook(r, 0);
  const cover = el("div", "logo", String(r.tracks.length));
  cover.title = t("track_count");
  const info = el("div", "info");
  info.append(el("div", "name", r.title));
  const showColl = S.tab === "favorites" || (S.scope === "all" && S.query);
  info.append(el("div", "sub", [showColl ? r.collection.replace(/_/g, " ") : null, r.folder, t("n_tracks", { n: num(r.tracks.length) })].filter(Boolean).join(" · ")));
  info.style.cursor = "pointer";
  info.onclick = () => { S.openPlaylist = S.openPlaylist === r.id ? null : r.id; wrap.replaceWith(bookRow(r)); };
  const acts = el("div", "actions");
  const fav = el("button", "icon-btn" + (isFav(r.id) ? " fav-on" : "")); fav.innerHTML = ICON_STAR; fav.title = t("favorite");
  fav.onclick = () => { toggleFav(r); fav.classList.toggle("fav-on", isFav(r.id)); };
  acts.append(fav);
  row.append(btn, cover, info, acts);
  wrap.append(row);
  if (S.openPlaylist === r.id) {
    const tl = el("div", "tracks");
    r.tracks.forEach((u, i) => {
      const tr = el("button", "track" + (P.current?.url === u ? " playing" : ""));
      tr.append(el("span", "i", String(i + 1)), el("span", "t", trackTitle(u)));
      tr.onclick = () => P.playBook(r, i);
      tl.append(tr);
    });
    wrap.append(tl);
  }
  return wrap;
}

// ---------- favorites ----------
const favKey = r => r.kind === "book" ? r.id : r.url;
const isFav = k => S.favs.some(f => favKey(f) === k);
function toggleFav(r) {
  const k = favKey(r);
  if (isFav(k)) S.favs = S.favs.filter(f => favKey(f) !== k);
  else { const { _k, ...clean } = r; S.favs.unshift(clean); }
  store.set("favs", S.favs);
}

// ---------- player ----------
// On an https page browsers block plain-http audio ("mixed content"), so http streams go through
// the server-side relay at ./stream (tools/stream_proxy.py behind nginx). On http/localhost: direct.
function playableUrl(url) {
  return location.protocol === "https:" && /^http:\/\//i.test(url) ? "stream?u=" + encodeURIComponent(url) : url;
}
const audio = $("#audio");
let hls = null;
// status is stored as a key (+ error flag) so it can be re-rendered when the language changes
let nowState = { key: null, err: false };
const P = {
  current: null, queue: [], qi: -1, wantPlay: false,
  load(url) {
    clearRetry(); this.wantPlay = true;
    if (hls) { hls.destroy(); hls = null; }
    audio.removeAttribute("src");
    const isHls = /\.m3u8(\?|$)/i.test(url);   // decided on the original URL, before proxying
    url = playableUrl(url);
    if (isHls && !audio.canPlayType("application/vnd.apple.mpegurl") && window.Hls?.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal && !reconnect()) showErr("err_hls"); });
      hls.loadSource(url); hls.attachMedia(audio);
    } else {
      audio.src = url;
    }
    audio.play().catch(e => { if (e.name !== "AbortError") showErr(e.name === "NotAllowedError" ? "err_tap" : "err_stream"); });
  },
  playStation(r, list) {
    this.queue = list.filter(x => x.kind === "radio"); this.qi = this.queue.indexOf(r);
    this.current = { kind: "radio", url: r.url, title: r.name, r };
    retry.n = 0; retry.played = false;
    this.load(r.url); updateNow("st_connecting"); refreshPlaying();
  },
  playBook(r, i) {
    this.queue = r.tracks.map(u => ({ url: u, r })); this.qi = i;
    this.current = { kind: "book", url: r.tracks[i], playlistId: r.id, title: trackTitle(r.tracks[i]), r, i };
    this.load(r.tracks[i]); updateNow("st_connecting"); refreshPlaying();
  },
  step(d) {
    const ni = this.qi + d;
    if (!this.current || ni < 0 || ni >= this.queue.length) return;
    if (this.current.kind === "radio") this.playStation(this.queue[ni], this.queue);
    else this.playBook(this.queue[ni].r, ni);
  },
  toggle() {
    if (!this.current) return;
    if (audio.paused) {
      // live streams: reconnect instead of resuming a stale buffer
      if (this.current.kind === "radio") this.load(this.current.url); else audio.play();
    } else { this.wantPlay = false; clearRetry(); audio.pause(); }
  },
};
function currentSub() {
  const c = P.current; if (!c) return "";
  if (c.kind === "book") return `${c.r.title} · ${c.i + 1}/${c.r.tracks.length}`;
  const r = c.r;
  return [r.country === "Unknown" ? null : countryName(r.country), r.lang === "Unknown" ? null : langName(r.lang),
          genreName(r.genre), r.bitrate && r.bitrate + " kbps"].filter(Boolean).join(" · ");
}
function updateNow(key, err) {
  if (key !== undefined) nowState = { key, err: !!err };
  $("#nowName").textContent = P.current ? P.current.title : t("pick_station");
  const sub = $("#nowSub");
  const state = nowState.key ? t(nowState.key) + (nowState.err ? " " + t("err_hint") : "") : "";
  sub.textContent = [state, currentSub()].filter(Boolean).join(" — ");
  sub.classList.toggle("err", nowState.err);
  $("#toggle").disabled = !P.current;
  $("#toggle").innerHTML = audio.paused ? ICON_BIG_PLAY : ICON_BIG_PAUSE;
  $("#seekBox").classList.toggle("hidden", !(P.current?.kind === "book" && isFinite(audio.duration)));
  document.title = P.current && !audio.paused ? `▶ ${P.current.title} · ${APP_NAME}` : APP_NAME;
  const artKey = P.current?.kind === "radio" ? P.current.url : "";
  const box = $("#nowArt");
  if (box.dataset.key !== artKey) {
    box.dataset.key = artKey;
    box.replaceChildren(...(artKey ? [stationArt(P.current.r.logo, P.current.title)] : []));
    box.classList.toggle("hidden", !artKey);
  }
  if ("mediaSession" in navigator && P.current) {
    const logo = P.current.kind === "radio" && usableLogo(P.current.r.logo);
    navigator.mediaSession.metadata = new MediaMetadata({ title: P.current.title, artist: currentSub() || APP_NAME,
      artwork: logo ? [{ src: logo }] : [{ src: "icons/icon-512.png", sizes: "512x512", type: "image/png" }] });
  }
}
// Live radio drops when the phone's network blips (e.g. switching 5G cells) and the browser then just
// stops. A station that has already played is reconnected a few times, backing off, before an error
// shows; reconnecting through the relay also fetches a fresh stream link. Never-played stations fail at once.
const RETRY_DELAYS = [1000, 2000, 4000, 8000, 15000];
const STALL_MS = 15000;       // buffering this long counts as a drop
const STABLE_MS = 30000;      // playing this long resets the retry count
const retry = { n: 0, played: false, timer: null, stall: null, stable: null };
function clearRetry() {
  clearTimeout(retry.timer); clearTimeout(retry.stall); clearTimeout(retry.stable);
  retry.timer = retry.stall = retry.stable = null;
}
function reconnect() {
  if (P.current?.kind !== "radio" || !P.wantPlay || !retry.played) return false;
  if (retry.timer) return true;
  if (retry.n >= RETRY_DELAYS.length) return false;
  clearRetry();
  updateNow("st_reconnecting");
  retry.timer = setTimeout(() => { retry.timer = null; if (P.wantPlay) P.load(P.current.url); }, RETRY_DELAYS[retry.n++]);
  return true;
}
function watchStall() {
  if (P.current?.kind !== "radio" || !retry.played || retry.stall || retry.timer) return;
  retry.stall = setTimeout(() => { retry.stall = null; reconnect(); }, STALL_MS);
}
function showErr(key) { P.wantPlay = false; clearRetry(); audio.pause(); updateNow(key, true); refreshPlaying(); }
function refreshPlaying() {
  document.querySelectorAll(".row[data-url]").forEach(row => {
    const on = P.current?.url === row.dataset.url;
    row.classList.toggle("playing", on);
    row.querySelector(".play").innerHTML = on && !audio.paused ? ICON_PAUSE : ICON_PLAY;
  });
  if (P.current?.kind === "book") {
    document.querySelectorAll(".track").forEach(x => x.classList.remove("playing"));
    const open = S.rows.find(r => r.id === S.openPlaylist);
    if (open) document.querySelectorAll(".track")[open.tracks.indexOf(P.current.url)]?.classList.add("playing");
  }
}
audio.addEventListener("playing", () => {
  updateNow("st_playing"); refreshPlaying();
  retry.played = true; clearTimeout(retry.stall); retry.stall = null;
  clearTimeout(retry.stable); retry.stable = setTimeout(() => { retry.n = 0; }, STABLE_MS);
});
audio.addEventListener("waiting", () => { if (!retry.timer) updateNow("st_buffering"); watchStall(); });
audio.addEventListener("stalled", watchStall);
audio.addEventListener("pause", () => { if (!nowState.err) updateNow("st_paused"); refreshPlaying(); });
audio.addEventListener("error", () => { if (audio.getAttribute("src") && !reconnect()) showErr("err_stream"); });
audio.addEventListener("ended", () => P.current?.kind === "book" ? P.step(1) : reconnect() || updateNow("st_ended"));
audio.addEventListener("loadedmetadata", () => updateNow(audio.paused ? "st_paused" : "st_playing"));
audio.addEventListener("timeupdate", () => {
  if (P.current?.kind !== "book" || !isFinite(audio.duration)) return;
  $("#tCur").textContent = fmtTime(audio.currentTime); $("#tDur").textContent = fmtTime(audio.duration);
  if (!seeking) $("#seek").value = Math.round(audio.currentTime / audio.duration * 1000);
});
let seeking = false;
$("#seek").addEventListener("input", () => { seeking = true; });
$("#seek").addEventListener("change", e => { seeking = false; if (isFinite(audio.duration)) audio.currentTime = e.target.value / 1000 * audio.duration; });
$("#toggle").onclick = () => P.toggle();
$("#prev").onclick = () => P.step(-1);
$("#next").onclick = () => P.step(1);
const vol = $("#vol");
vol.value = store.get("volume", 0.8); audio.volume = +vol.value;
vol.oninput = () => { audio.volume = +vol.value; store.set("volume", +vol.value); };
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("previoustrack", () => P.step(-1));
  navigator.mediaSession.setActionHandler("nexttrack", () => P.step(1));
  // lock-screen play/pause go through P.toggle, so a paused station is not auto-reconnected
  navigator.mediaSession.setActionHandler("play", () => { if (audio.paused) P.toggle(); });
  navigator.mediaSession.setActionHandler("pause", () => { if (!audio.paused) P.toggle(); });
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.code === "Space") { e.preventDefault(); P.toggle(); }
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

// ---------- wiring ----------
const uiLang = $("#uiLang");
LOCALES.forEach((loc, i) => { const o = el("option", null, LOCALE_NAMES[i]); o.value = loc; o.lang = loc; uiLang.append(o); });
uiLang.value = LOCALE;
uiLang.onchange = () => {
  setLocale(uiLang.value); store.set("locale", uiLang.value);
  // no country picked by hand yet → follow the new language's first country
  if (store.get("country", null) == null) { S.country = null; S.lang = S.genre = null; }
  applyStaticText(); updateNow();
  if (S.index) { renderSide(); renderContent(); }
};

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#sideFilter").value = "";
  $("#sideFilter").parentElement.classList.toggle("hidden", S.tab === "favorites");
  $("#scope").classList.toggle("hidden", S.tab === "favorites");
  applyStaticText();
  resetAndRender();
});
let qTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { S.query = e.target.value.trim(); S.shown = PAGE; S.openPlaylist = null; renderContent(); }, S.scope === "all" ? 450 : 200);
});
$("#scope").onchange = e => {
  S.scope = e.target.value;
  if (S.scope === "all" && S.tab === "audiobooks" && !bookRowsCache.size)
    $("#content").prepend(el("div", "status", t("books_all_warn")));
  if (S.query) { S.shown = PAGE; renderContent(); }
};
$("#sideFilter").addEventListener("input", renderSide);
$("#sideToggle").onclick = () => setSideOpen(!sideOpen());
setSideOpen(store.get("sideOpen", true));

applyStaticText();
updateNow();
(async () => {
  try {
    S.index = await loadJSON("data/index.json");
  } catch (e) {
    $("#content").append(el("div", "empty", t("index_fail")));
    return;
  }
  resetAndRender();
})();
</script>
</body>
